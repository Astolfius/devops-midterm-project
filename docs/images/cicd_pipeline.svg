    <text x="750" y="17" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="end">Branch: main • Commit: a8f91b2</text>
  </g>

  <!-- Stage Connectors -->
