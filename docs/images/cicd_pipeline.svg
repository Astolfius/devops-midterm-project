    <path d="M23 30l3.5 3.5 6-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="34" fill="#f0f6fc" font-family="sans-serif" font-size="15" font-weight="bold">2. Test</text>
    
