    <text x="50" y="34" fill="#f0f6fc" font-family="sans-serif" font-size="15" font-weight="bold">1. Build</text>
    
    <text x="20" y="66" fill="#8b949e" font-family="monospace" font-size="12">• Checkout repo</text>
    <text x="20" y="85" fill="#8b949e" font-family="monospace" font-size="12">• Setup Node.js v20</text>
