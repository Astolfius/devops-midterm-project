    <rect x="165" y="18" width="45" height="18" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="187" y="31" fill="#58a6ff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">PASS</text>
